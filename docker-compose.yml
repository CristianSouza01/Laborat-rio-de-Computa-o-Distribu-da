# Cluster MPI - 4 nos (master + 3 workers)
# Observacao: no GitHub Codespaces o trafego entre containers em redes
# definidas pelo usuario e bloqueado; por isso os nos usam a bridge padrao
# (network_mode: bridge) e a resolucao de nomes e feita via /etc/hosts.
services:
  master:
    build:
      context: .
      network: host
    image: lab3mpi:latest
    container_name: master
    hostname: master
    network_mode: bridge
    tty: true
    command: ["bash", "-c", "service ssh start && tail -f /dev/null"]

  worker1:
    image: lab3mpi:latest
    container_name: worker1
    hostname: worker1
    network_mode: bridge
    tty: true
    command: ["bash", "-c", "service ssh start && tail -f /dev/null"]

  worker2:
    image: lab3mpi:latest
    container_name: worker2
    hostname: worker2
    network_mode: bridge
    tty: true
    command: ["bash", "-c", "service ssh start && tail -f /dev/null"]

  worker3:
    image: lab3mpi:latest
    container_name: worker3
    hostname: worker3
    network_mode: bridge
    tty: true
    command: ["bash", "-c", "service ssh start && tail -f /dev/null"]
